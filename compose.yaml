x-app: &app
  build: .
  image: senti-analysis-reviews
  restart: unless-stopped
  environment: &app-env
    DJANGO_DEBUG: "1"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    POSTGRES_HOST: db
    POSTGRES_DB: reviews
    POSTGRES_USER: reviews
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviews}
    CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    # Separate Redis DB for the sentiment cache used in reviews/tasks.py
    SENTIMENT_CACHE_URL: redis://redis:6379/1
  depends_on: &app-deps
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - sqlite_data:/data
    ports:
      - "8000:8000"
 
  celery-worker:
    <<: *app
    build: .
    command: celery -A review_project worker --loglevel=info --concurency=1
    volumes:
      - .:/app
      - huggingface_cache:/home/appuser/.cache/huggingface
      - sqlite_data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "15672:15672" 
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sqlite_data:
  rabbitmq_data:
  redis_data:
  huggingface_cache:

